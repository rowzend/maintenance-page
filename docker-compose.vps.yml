services:
  maintenance-app:
    image: ghcr.io/${GITHUB_USERNAME}/maintenance-page:latest
    container_name: maintenance-app
    ports:
      - "3099:3000"
    environment:
      - NODE_ENV=production
    networks:
      - proxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  proxy-network:
    external: true
