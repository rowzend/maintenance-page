services:
  maintenance-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAINTENANCE_TITLE: "Under Maintenance"
        NEXT_PUBLIC_MAINTENANCE_SUBTITLE: "Kami sedang melakukan pemeliharaan sistem untuk meningkatkan layanan"
        NEXT_PUBLIC_MAINTENANCE_WHAT: "Sistem sedang dalam proses pembaruan untuk meningkatkan performa dan keamanan. Mohon bersabar menunggu hingga proses selesai."
        NEXT_PUBLIC_MAINTENANCE_WHEN: "Kami akan kembali online secepatnya. Silakan coba refresh halaman ini secara berkala."
        # Optional: Uncomment and set when needed
        # NEXT_PUBLIC_MAINTENANCE_ESTIMATED_TIME: "Estimasi selesai: Pukul 14:00 WIB"
        # NEXT_PUBLIC_MAINTENANCE_CONTACT: "Untuk informasi lebih lanjut hubungi: it@bkpsdm.pesisirselatankab.go.id"
    container_name: maintenance-app
    ports:
      - "3099:3000"
    environment:
      - NODE_ENV=production
    networks:
      - proxy-network
    restart: unless-stopped

networks:
  proxy-network:
    external: true
